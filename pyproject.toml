[project]
name = "ecuador-evolution"
version = "0.1.0"
description = "Reproducible spatial modeling for Ecuador's 2010 and 2022 censuses"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.1.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=23.0.1",
    "requests>=2.34.0",
    "scikit-learn>=1.8.0",
    "shapely>=2.1.2",
    "tabulate>=0.9.0",
    "torch>=2.13.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]

[project.scripts]
ecuador-evolution = "ecuador_evolution.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecuador_evolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = ["cuda: requires an NVIDIA CUDA device"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
