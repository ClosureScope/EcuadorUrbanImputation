# Machine-readable harmonization contract. Source field/category details are
# confirmed against the downloaded official dictionaries before full prepare.
[[indicator]]
name = "population"
unit = "count"
universe = "usual/de-facto residents"
numerator = "persons"
denominator = "none"
comparability = "medium"
recode = "count person records"
source_2010 = { table = "Poblacion", fields = ["I01", "I02", "I03", "I04", "I05", "ID_HOG"], rule = "count eligible person records" }
source_2022 = { table = "Población", fields = ["I01", "I02", "I03", "I04", "I05", "ID_HOG"], rule = "count usual-resident person records" }
flags = ["2010-de-facto-vs-2022-usual-residence"]

